name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Hermes ${{ matrix.hermes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes: ["v0.23.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Hermes Agent ${{ matrix.hermes }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .hermes-agent
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Hermes from its lockfile
        working-directory: .hermes-agent
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --group dev

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Validate plugin
        run: |
          export HERMES_HOME="$(mktemp -d)"
          .venv/bin/hermes plugins validate .
